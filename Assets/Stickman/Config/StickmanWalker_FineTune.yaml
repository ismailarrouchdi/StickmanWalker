# =====================================================================================================================
# FINE-TUNING of an existing gait (starting from a model that already walks).
#
#   mlagents-learn Assets/Stickman/Config/StickmanWalker_FineTune.yaml --run-id=stickman_02 \
#       --initialize-from=stickman_01 --timeout-wait=300
#
# Differences from StickmanWalker.yaml:
#   - no curriculum: final speed (1.3 m/s) without assistance right away. With the curriculum, a resumed model would
#     restart at the "stand" lesson and could unlearn walking;
#   - lower learning rate and entropy, 10 M steps.
# Every other setting is identical to StickmanWalker.yaml, where each one is explained.
# =====================================================================================================================

behaviors:
  StickmanWalker:
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 1.0e-4           # Lower than for initial training: adjust a working gait without breaking it.
      learning_rate_schedule: linear
      beta: 2.0e-3                    # Lower entropy bonus: the useful exploration has already been done.
      beta_schedule: linear
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 256               # Must match the model given to --initialize-from.
      num_layers: 3

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

    max_steps: 1.0e7                  # Extend with --resume after raising this value if needed.
    time_horizon: 1000
    summary_freq: 30000
    checkpoint_interval: 500000
    keep_checkpoints: 10

environment_parameters:
  target_speed: 1.3                   # Comfortable human walking speed (m/s).
  balance_assist: 0.0                 # No assistance: the gait being refined is the real one.

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false
