# =====================================================================================================================
# PPO training of the stickman walker, with a curriculum. For mlagents-learn (Python package mlagents 1.1.0).
#
# Run from the root of the Unity project:
#   mlagents-learn Assets/Stickman/Config/StickmanWalker.yaml --run-id=stickman_01 --timeout-wait=300
# then press Play in Unity once the terminal shows "Listening on port 5004".
#
# Scale: one ML-Agents "step" = one decision of ONE agent. Decisions every 4 physics steps at 100 Hz give 25 decisions
# per simulated second per agent; with 16 agents, 400 steps per simulated second. A full episode (30 s) = 750 decisions.
# =====================================================================================================================

behaviors:
  StickmanWalker:                     # Must match the agents' Behavior Name (Behavior Parameters component).
    trainer_type: ppo

    hyperparameters:
      batch_size: 2048                # Experiences per gradient-descent minibatch. Large values reduce gradient noise,
                                      # which continuous actions need. Usual range: 512 - 5120.
      buffer_size: 40960              # Experiences collected before each policy update (= 20 minibatches). Must be a
                                      # multiple of batch_size. Usual range: 10 to 20 x batch_size.
      learning_rate: 3.0e-4           # Initial learning rate. Lower it (1e-4) if the reward collapses or oscillates.
      learning_rate_schedule: linear  # Decays linearly to ~0 at max_steps, which refines the gait at the end.
      beta: 5.0e-3                    # Entropy bonus, keeps exploring. Raise it (1e-2) if the agent settles too early
                                      # on a poor gait; lower it (1e-3) if the gait stays shaky.
      beta_schedule: linear
      epsilon: 0.2                    # PPO clipping: how far the new policy may move from the old one per update.
      epsilon_schedule: linear
      lambd: 0.95                     # GAE lambda: bias / variance trade-off of the advantage estimate.
      num_epoch: 3                    # Passes over the buffer per update. More is more sample-efficient but less stable.

    network_settings:
      normalize: true                 # Running normalisation of the observations, essential for continuous control.
      hidden_units: 256
      num_layers: 3                   # 3 x 256: the proven setting of the ML-Agents Walker example.

    reward_signals:
      extrinsic:
        gamma: 0.995                  # Discount factor: horizon ≈ 1 / (1 - 0.995) = 200 decisions = 8 s, long enough
                                      # for a costly step now to be repaid by balance later.
        strength: 1.0

    max_steps: 3.0e7                  # A good gait typically appears around 4-5 M steps and stabilises around 10 M.
    time_horizon: 1000                # Longer than an episode (750 decisions): full episodes are used as they are.
    summary_freq: 30000               # TensorBoard point every 30,000 steps.
    checkpoint_interval: 500000       # Checkpoint (.pt + .onnx) every 500,000 steps.
    keep_checkpoints: 10

# ---------------------------------------------------------------------------------------------------------------------
# Curriculum: stand first (with balance assistance), then walk slowly, then walk at human speed.
#   target_speed   : requested speed (m/s), read by the agent at the start of each episode.
#   balance_assist : restoring torque on the torso (0..1), always 0 in the last lesson: the final gait is never assisted.
# Both parameters use identical criteria, so they change lesson together.
# Criterion: smoothed mean cumulative reward per episode. A perfect 30 s episode scores ≈ 27 standing (lesson 0) and
# ≈ 40-50 walking well at the target speed; standing still while a speed is requested scores ≈ 6.
# ---------------------------------------------------------------------------------------------------------------------
environment_parameters:
  target_speed:
    curriculum:
      - name: Lesson0_Stand
        completion_criteria: &lesson0_criteria
          measure: reward
          behavior: StickmanWalker
          signal_smoothing: true
          min_lesson_length: 100      # At least 100 episodes in the lesson before moving on.
          threshold: 20.0
        value: 0.0
      - name: Lesson1_FirstSteps
        completion_criteria: &lesson1_criteria
          measure: reward
          behavior: StickmanWalker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 30.0
        value: 0.5
      - name: Lesson2_SlowWalk
        completion_criteria: &lesson2_criteria
          measure: reward
          behavior: StickmanWalker
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 33.0
        value: 0.9
      - name: Lesson3_Walk
        value: 1.3                    # Comfortable human walking speed.

  balance_assist:
    curriculum:
      - name: Lesson0_Stand
        completion_criteria: *lesson0_criteria
        value: 1.0
      - name: Lesson1_FirstSteps
        completion_criteria: *lesson1_criteria
        value: 0.5
      - name: Lesson2_SlowWalk
        completion_criteria: *lesson2_criteria
        value: 0.2
      - name: Lesson3_Walk
        value: 0.0

engine_settings:
  time_scale: 20                      # Simulation sped up 20x. Physics still runs at 100 Hz of simulated time.
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: false                  # true is possible with a standalone build (--env) to skip rendering.
